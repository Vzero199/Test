# Save as .github/workflows/build-android.yml in your repo
name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Android image is huge; free runner disk space first
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # Unity runs out of memory on the default 8 GB runner, so add swap
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          lfs: true

      # Set Android player settings (ARM64 + IL2CPP, no code stripping)
      - name: Patch Android settings
        run: |
          python3 - <<'PY'
          import re
          p = "ProjectSettings/ProjectSettings.asset"
          t = open(p, encoding="utf-8").read()
          nl = "\r\n" if "\r\n" in t else "\n"
          lines = t.split(nl)

          def set_top(key, value):
              for i, l in enumerate(lines):
                  if re.match(r"^  " + key + r":", l):
                      lines[i] = "  %s: %s" % (key, value)
                      return
              raise SystemExit("key not found: " + key)

          def set_map(key, sub, value):
              for i, l in enumerate(lines):
                  if re.match(r"^  " + key + r":\s*(\{\})?\s*$", l):
                      if l.rstrip().endswith("{}"):
                          lines[i] = "  %s:" % key
                      j = i + 1
                      while j < len(lines) and lines[j].startswith("    "):
                          if lines[j].strip().startswith(sub + ":"):
                              lines[j] = "    %s: %s" % (sub, value)
                              return
                          j += 1
                      lines.insert(j, "    %s: %s" % (sub, value))
                      return
              raise SystemExit("map not found: " + key)

          def set_or_add_top(key, value):
              for i, l in enumerate(lines):
                  if re.match(r"^  " + key + r":", l):
                      lines[i] = "  %s: %s" % (key, value)
                      return
              for i, l in enumerate(lines):
                  if l.startswith("PlayerSettings:"):
                      lines.insert(i + 1, "  %s: %s" % (key, value))
                      return

          set_or_add_top("AndroidBundleVersionCode", 1)
          # Landscape only (auto-rotate between the two landscape sides)
          set_or_add_top("defaultScreenOrientation", 4)
          set_or_add_top("allowedAutorotateToPortrait", 0)
          set_or_add_top("allowedAutorotateToPortraitUpsideDown", 0)
          set_or_add_top("allowedAutorotateToLandscapeRight", 1)
          set_or_add_top("allowedAutorotateToLandscapeLeft", 1)
          set_top("AndroidTargetArchitectures", 2)
          set_map("scriptingBackend", "Android", 1)
          set_map("managedStrippingLevel", "Android", 0)
          open(p, "w", encoding="utf-8", newline="").write(nl.join(lines))
          PY

      # Make the PC-only scripts work with touch, and write the on-screen error overlay
      - name: Patch scripts for touch
        run: |
          python3 - <<'PY'
          import re, sys, os

          base = "Assets/Scripts/Assembly-CSharp/"

          def patch(name, pattern, repl, flags=0):
              path = base + name
              if not os.path.exists(path):
                  print("WARNING: missing " + path)
                  return
              t = open(path, encoding="utf-8-sig").read()
              new, n = re.subn(pattern, lambda m: repl, t, flags=flags)
              if n == 0:
                  if repl in t:
                      print("already patched: " + name)
                  else:
                      print("WARNING: pattern not found in " + name)
                  return
              open(path, "w", encoding="utf-8", newline="").write(new)
              print("patched %s (%d)" % (name, n))

          PTR = "(UnityEngine.InputSystem.Pointer.current != null ? UnityEngine.InputSystem.Pointer.current.position.ReadValue() : Vector2.zero)"

          # Mouse position -> pointer position (mouse or touch)
          patch("UIDragWithMouse.cs",
                r"Mouse\.current\.position\.ReadValue\(\)", PTR)
          patch("RotateToTarget.cs",
                r"Input\.mousePosition", "((Vector3)" + PTR + ")")

          # Escape key (Android Back button) with the new Input System
          patch("QuitGameOnKeypress.cs",
                r"Input\.GetKeyDown\(key\)",
                "(UnityEngine.InputSystem.Keyboard.current != null && UnityEngine.InputSystem.Keyboard.current.escapeKey.wasPressedThisFrame)")

          # FitTextWidth can be called before its own Awake has run
          patch("FitTextWidth.cs",
                r"public void UpdateWidth\(\)\s*\{",
                "public void UpdateWidth()\n\t{\n\t\tif (rectTransform == null) { rectTransform = GetComponent<RectTransform>(); }")

          # Do not restrict UI input to keyboard and mouse (a phone has neither)
          patch("PauseMenu.cs",
                r"inputSystemUIInputModule\.actionsAsset\.devices\s*=\s*new InputDevice\[2\]\s*\{\s*Keyboard\.current,\s*Mouse\.current\s*\};",
                "inputSystemUIInputModule.actionsAsset.devices = null;", re.S)
          PY
          cat > Assets/PortDebugOverlay.cs <<'CS'
          // Temporary debugging aid (written by the build workflow). Shows the current scene and errors.
          using System.Collections.Generic;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          public class PortDebugOverlay : MonoBehaviour
          {
              static readonly List<string> order = new List<string>();
              static readonly Dictionary<string, int> counts = new Dictionary<string, int>();
              static string sceneInfo = "(no scene yet)";
              GUIStyle style;
              Texture2D bg;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
              static void Init()
              {
                  var go = new GameObject("PortDebugOverlay");
                  DontDestroyOnLoad(go);
                  go.AddComponent<PortDebugOverlay>();
                  Application.logMessageReceived += OnLog;
                  SceneManager.sceneLoaded += (scene, mode) =>
                  {
                      sceneInfo = "scene: " + scene.name;
                      Add("LOADED " + scene.name);
                  };
              }

              static void Add(string s)
              {
                  int c;
                  if (counts.TryGetValue(s, out c)) { counts[s] = c + 1; return; }
                  counts[s] = 1;
                  order.Add(s);
                  if (order.Count > 60) { counts.Remove(order[0]); order.RemoveAt(0); }
              }

              static void OnLog(string condition, string stack, LogType type)
              {
                  if (type == LogType.Log || type == LogType.Warning) return;
                  string top = "";
                  if (!string.IsNullOrEmpty(stack))
                  {
                      var parts = stack.Split('\n');
                      for (int i = 0; i < parts.Length && i < 2; i++) top += "\n   " + parts[i];
                  }
                  Add(type + ": " + condition + top);
              }

              void OnGUI()
              {
                  if (style == null)
                  {
                      style = new GUIStyle(GUI.skin.label);
                      style.fontSize = Mathf.Max(12, Screen.height / 60);
                      style.wordWrap = true;
                      style.normal.textColor = Color.white;
                      bg = new Texture2D(1, 1);
                      bg.SetPixel(0, 0, new Color(0f, 0f, 0f, 0.5f));
                      bg.Apply();
                  }
                  GUI.depth = -1000;
                  var area = new Rect(0, 0, Screen.width, Screen.height * 0.25f);
                  GUI.DrawTexture(area, bg);
                  string text = sceneInfo + "   time: " + Time.realtimeSinceStartup.ToString("F0") + "s\n";
                  int start = Mathf.Max(0, order.Count - 4);
                  for (int i = start; i < order.Count; i++)
                      text += "[x" + counts[order[i]] + "] " + order[i] + "\n";
                  GUI.Label(area, text, style);
              }
          }
          CS

      # Restore the import cache (saves about an hour on later runs)
      - uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}
          restore-keys: Library-Android-

      # The recovered scenes point at the game's old package DLLs. Re-point them at the
      # real package scripts (needs the package cache restored just above).
      - name: Remap package script references
        run: |
          python3 - <<'PY'
          import os, re, struct, sys, collections

          # ---- MD4 (Unity derives script file IDs from an MD4 hash of namespace + class name) ----
          def _lrot(x, n):
              x &= 0xffffffff
              return ((x << n) | (x >> (32 - n))) & 0xffffffff

          def md4(data):
              msg = bytearray(data); l = len(msg) * 8
              msg.append(0x80)
              while len(msg) % 64 != 56:
                  msg.append(0)
              msg += struct.pack("<Q", l)
              a, b, c, d = 0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476
              F = lambda x, y, z: (x & y) | (~x & z)
              G = lambda x, y, z: (x & y) | (x & z) | (y & z)
              H = lambda x, y, z: x ^ y ^ z
              for off in range(0, len(msg), 64):
                  X = struct.unpack("<16I", bytes(msg[off:off + 64]))
                  aa, bb, cc, dd = a, b, c, d
                  for i in range(16):
                      s = [3, 7, 11, 19][i % 4]
                      t = (a + F(b, c, d) + X[i]) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  for i in range(16):
                      k = (i % 4) * 4 + i // 4; s = [3, 5, 9, 13][i % 4]
                      t = (a + G(b, c, d) + X[k] + 0x5a827999) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  order = [0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7, 15]
                  for i in range(16):
                      k = order[i]; s = [3, 9, 11, 15][i % 4]
                      t = (a + H(b, c, d) + X[k] + 0x6ed9eba1) & 0xffffffff
                      a, b, c, d = d, _lrot(t, s), b, c
                  a = (a + aa) & 0xffffffff; b = (b + bb) & 0xffffffff
                  c = (c + cc) & 0xffffffff; d = (d + dd) & 0xffffffff
              return struct.pack("<4I", a, b, c, d)

          def file_id(ns, name):
              return struct.unpack("<i", md4(("s\0\0\0" + ns + name).encode("utf-8"))[:4])[0]

          GUID_RE = re.compile(r"^guid:\s*([0-9a-f]{32})", re.M)
          NS_RE = re.compile(r"^\s*namespace\s+([\w.]+)", re.M)
          REF_RE = re.compile(r"\{fileID: (-?\d+), guid: ([0-9a-f]{32}), type: 3\}")
          YAML_EXT = {".unity", ".prefab", ".asset", ".playable", ".controller", ".overridecontroller",
                      ".anim", ".mask", ".signal", ".mixer", ".lighting", ".preset", ".guiskin",
                      ".rendertexture", ".spriteatlas", ".brush", ".flare", ".fontsettings"}

          def read(path):
              with open(path, encoding="utf-8-sig", errors="surrogateescape") as f:
                  return f.read()

          def main(project_dirs, package_dirs):
              # 1) every script GUID that exists in the project
              known = set()
              for root in project_dirs:
                  for dp, dn, fn in os.walk(root):
                      for f in fn:
                          if f.endswith(".meta"):
                              m = GUID_RE.search(read(os.path.join(dp, f)))
                              if m:
                                  known.add(m.group(1))
              # 2) class hash -> package script GUID
              classmap = {}
              nscripts = 0
              for root in package_dirs:
                  for dp, dn, fn in os.walk(root):
                      if "/Editor" in dp.replace("\\", "/") or "/Tests" in dp.replace("\\", "/"):
                          continue
                      for f in fn:
                          if not f.endswith(".cs"):
                              continue
                          meta = os.path.join(dp, f + ".meta")
                          if not os.path.exists(meta):
                              continue
                          g = GUID_RE.search(read(meta))
                          if not g:
                              continue
                          src = read(os.path.join(dp, f))
                          ns = NS_RE.search(src)
                          ns = ns.group(1) if ns else ""
                          classmap.setdefault(file_id(ns, f[:-3]), g.group(1))
                          nscripts += 1
              print("package scripts indexed: %d, project script guids: %d" % (nscripts, len(known)))
              # 3) rewrite references to the old precompiled DLLs
              fixed = 0; files = 0
              unmapped = collections.Counter()
              for root in project_dirs:
                  for dp, dn, fn in os.walk(root):
                      for f in fn:
                          if os.path.splitext(f)[1].lower() not in YAML_EXT:
                              continue
                          path = os.path.join(dp, f)
                          text = read(path)
                          if "type: 3}" not in text:
                              continue
                          changed = [0]
                          def sub(m):
                              fid, guid = int(m.group(1)), m.group(2)
                              if fid == 11500000 or guid in known:
                                  return m.group(0)
                              new = classmap.get(fid)
                              if new is None:
                                  unmapped[(guid, fid)] += 1
                                  return m.group(0)
                              changed[0] += 1
                              return "{fileID: 11500000, guid: %s, type: 3}" % new
                          out = REF_RE.sub(sub, text)
                          if changed[0]:
                              with open(path, "w", encoding="utf-8", newline="", errors="surrogateescape") as fo:
                                  fo.write(out)
                              fixed += changed[0]; files += 1
              print("references remapped: %d in %d files" % (fixed, files))
              if unmapped:
                  print("UNMAPPED references: %d distinct" % len(unmapped))
                  for (g, i), n in unmapped.most_common(15):
                      print("   guid %s fileID %d x%d" % (g, i, n))

          pk = [p for p in ["Library/PackageCache"] if os.path.isdir(p)]
          if not pk:
              print("WARNING: Library/PackageCache not found, nothing remapped")
          else:
              main(["Assets"], pk)
          PY

      # AssetRipper exports empty placeholder shaders. Swap them for the real package
      # shaders (TextMeshPro, URP 2D sprites, lights, blit...) and repoint the materials.
      - name: Replace placeholder shaders
        run: |
          python3 - <<'PY'
          import os, re

          NAME_RE = re.compile(r'^\s*Shader\s+"([^"]+)"', re.M)
          GUID_RE = re.compile(r"^guid:\s*([0-9a-f]{32})", re.M)
          REF_EXT = {".mat", ".asset", ".prefab", ".unity", ".shadervariants", ".playable", ".rendertexture",
                     ".controller", ".overridecontroller", ".spriteatlas", ".lighting", ".preset"}

          def read(path):
              with open(path, encoding="utf-8-sig", errors="surrogateescape") as f:
                  return f.read()

          pk = "Library/PackageCache"
          if not os.path.isdir(pk):
              print("WARNING: Library/PackageCache not found, shaders not replaced")
              raise SystemExit(0)

          # 1) shader name -> GUID of the real shader in the packages
          real = {}
          for dp, dn, fn in os.walk(pk):
              if "/Tests" in dp.replace("\\", "/"):
                  continue
              for f in fn:
                  if f.endswith(".shader") and os.path.exists(os.path.join(dp, f + ".meta")):
                      m = NAME_RE.search(read(os.path.join(dp, f))[:4000])
                      g = GUID_RE.search(read(os.path.join(dp, f + ".meta")))
                      if m and g:
                          real.setdefault(m.group(1), g.group(1))
          print("package shaders indexed: %d" % len(real))

          # 2) the recovered project holds empty placeholder shaders: find the ones that exist in packages
          swap = {}
          doomed = []
          unmatched = []
          for dp, dn, fn in os.walk("Assets"):
              for f in fn:
                  if not f.endswith(".shader"):
                      continue
                  path = os.path.join(dp, f)
                  text = read(path)
                  m = NAME_RE.search(text)
                  mp = path + ".meta"
                  if not m or not os.path.exists(mp):
                      continue
                  g = GUID_RE.search(read(mp))
                  if not g:
                      continue
                  if m.group(1) in real:
                      swap[g.group(1)] = real[m.group(1)]
                      doomed.append(path)
                  else:
                      unmatched.append(m.group(1))
          print("placeholder shaders replaced by package shaders: %d" % len(swap))
          if unmatched:
              print("NOT in any package (still placeholders): " + ", ".join(sorted(unmatched)))

          # 3) repoint every reference, then delete the placeholders
          if swap:
              pat = re.compile("guid: (" + "|".join(swap) + ")")
              n = 0
              for root in ("Assets", "ProjectSettings"):
                  for dp, dn, fn in os.walk(root):
                      for f in fn:
                          if os.path.splitext(f)[1].lower() not in REF_EXT:
                              continue
                          path = os.path.join(dp, f)
                          t = read(path)
                          new, c = pat.subn(lambda m: "guid: " + swap[m.group(1)], t)
                          if c:
                              with open(path, "w", encoding="utf-8", newline="", errors="surrogateescape") as fo:
                                  fo.write(new)
                              n += c
              print("shader references repointed: %d" % n)
              for p in doomed:
                  os.remove(p); os.remove(p + ".meta")
          PY

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.25f1
          targetPlatform: Android
          androidExportType: androidPackage
          versioning: None

      # Save the cache even if the build fails
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: Library
          key: Library-Android-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Android
